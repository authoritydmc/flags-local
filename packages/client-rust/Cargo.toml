[package]
name = "flags-local"
version = "1.0.0"
edition = "2021"
description = "High-performance Rust client SDK for flags-local feature flag management"
license = "MIT"
repository = "https://github.com/authoritydmc/flags-local"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
